<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفرص | اتجاهك</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="layout-root"></div>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function init() {
  const user = await requireAuth();
  if (!user) return;
  renderShell("opportunities", user);
  const main = document.getElementById("page-main");
  const isEn = () => (typeof CURRENT_LANG !== "undefined" && CURRENT_LANG === "en");

  try {
    const res = await fetch(`${API_BASE}/opportunities`, { headers: authHeaders() });
    if (res.status === 400) {
      main.innerHTML = `<div class="card" style="text-align:center; padding:40px;"><p class="muted">${isEn() ? "No analysis yet." : "لا يوجد تحليل بعد."}</p><a href="analyze.html" class="btn-primary">${isEn() ? "Start Analysis" : "ابدئي التحليل"}</a></div>`;
      return;
    }
    if (!res.ok) throw new Error("failed");
    const opportunities = await res.json();

    const oppHtml = (!opportunities || opportunities.length === 0)
      ? `<div class="empty-hint">${isEn() ? "No opportunities available right now." : "لا توجد فرص متاحة حاليًا."}</div>`
      : opportunities.map(o => `
        <div class="opp-card">
          <div class="opp-icon">${o.icon}</div>
          <div class="opp-body">
            <strong>${bi(o, "name_ar", "name_en")}</strong>
            <span class="type">${o.type}</span>
            <div class="reason">${bi(o, "reason_ar", "reason_en")}</div>
          </div>
          <div class="opp-match">${o.match_score}%</div>
        </div>`).join("");

    main.innerHTML = `
      <h2 style="color:var(--navy); margin-bottom:16px;">🚀 ${isEn() ? "Opportunities Matched for You" : "فرص مناسبة لك"}</h2>
      <div class="card"><div class="opp-list">${oppHtml}</div></div>`;
  } catch (err) {
    main.innerHTML = `<div class="empty-hint">${isEn() ? "Error loading data." : "خطأ بتحميل البيانات."}</div>`;
  }
})();
</script>
</body>
</html>
