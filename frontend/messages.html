<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرسائل | اتجاهك</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="layout-root"></div>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
let activeConversationUsername = null;
let messagesPollInterval = null;

(async function init() {
  const user = await requireAuth();
  if (!user) return;
  renderShell("messages", user);
  const main = document.getElementById("page-main");
  const isEn = () => (typeof CURRENT_LANG !== "undefined" && CURRENT_LANG === "en");

  main.innerHTML = `
    <h2 style="color:var(--navy); margin-bottom:16px;" data-i18n="section_messages_title"></h2>
    <div class="card wide">
      <div class="messages-shell">
        <div class="conv-sidebar">
          <div class="conv-search">
            <input type="text" id="user-search-input" data-i18n-placeholder="user_search_placeholder">
            <div id="user-search-results" class="search-results"></div>
          </div>
          <div id="conversations-list" class="conv-list"></div>
        </div>
        <div class="conv-main">
          <div id="chat-empty" class="empty-hint" data-i18n="chat_placeholder"></div>
          <div id="chat-thread" style="display:none;">
            <div class="chat-header" id="chat-header"></div>
            <div class="chat-messages" id="chat-messages"></div>
            <form id="chat-form" class="chat-form">
              <input type="text" id="chat-input" data-i18n-placeholder="chat_input_placeholder" autocomplete="off">
              <button type="submit" class="btn-primary" data-i18n="btn_send"></button>
            </form>
          </div>
        </div>
      </div>
    </div>`;
  if (typeof applyTranslations === "function") applyTranslations();

  await loadConversations();

  document.getElementById("user-search-input").addEventListener("input", async (e) => {
    const q = e.target.value.trim();
    const resultsBox = document.getElementById("user-search-results");
    if (q.length < 2) { resultsBox.innerHTML = ""; return; }
    try {
      const res = await fetch(`${API_BASE}/users/search?q=${encodeURIComponent(q)}`, { headers: authHeaders() });
      if (!res.ok) return;
      const users = await res.json();
      resultsBox.innerHTML = users.length === 0
        ? `<div class="search-result-item muted">${isEn() ? "No results" : "لا نتائج"}</div>`
        : users.map(u => `<div class="search-result-item" data-username="${u.username}" data-name="${escapeHtml(u.name)}">${u.name} <span class="muted">(@${u.username})</span></div>`).join("");

      resultsBox.querySelectorAll(".search-result-item[data-username]").forEach(item => {
        item.addEventListener("click", () => {
          openConversation(item.dataset.username, item.dataset.name);
          document.getElementById("user-search-input").value = "";
          resultsBox.innerHTML = "";
        });
      });
    } catch (err) { /* صامت */ }
  });

  document.getElementById("chat-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("chat-input");
    const content = input.value.trim();
    if (!content || !activeConversationUsername) return;
    input.value = "";
    try {
      const res = await fetch(`${API_BASE}/messages/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...authHeaders() },
        body: JSON.stringify({ to_username: activeConversationUsername, content }),
      });
      if (!res.ok) throw new Error("failed");
      await refreshThread();
      loadConversations();
    } catch (err) {
      alert(isEn() ? "Failed to send message" : "فشل إرسال الرسالة");
    }
  });

  // لو جاي من زر "تواصل معي" ببروفايل عام
  const params = new URLSearchParams(window.location.search);
  const composeWith = params.get("compose");
  if (composeWith) {
    window.history.replaceState({}, document.title, window.location.pathname);
    try {
      const res = await fetch(`${API_BASE}/users/search?q=${encodeURIComponent(composeWith)}`, { headers: authHeaders() });
      const users = res.ok ? await res.json() : [];
      const match = users.find(u => u.username === composeWith) || { username: composeWith, name: composeWith };
      openConversation(match.username, match.name);
    } catch (err) {
      openConversation(composeWith, composeWith);
    }
  }

  async function loadConversations() {
    try {
      const res = await fetch(`${API_BASE}/messages/conversations`, { headers: authHeaders() });
      if (!res.ok) return;
      const conversations = await res.json();
      const wrap = document.getElementById("conversations-list");
      wrap.innerHTML = conversations.length === 0
        ? `<div class="empty-hint" style="font-size:12px;">${isEn() ? "No conversations yet" : "لا توجد محادثات بعد"}</div>`
        : conversations.map(c => `
          <div class="conv-item ${c.username === activeConversationUsername ? 'active' : ''}" data-username="${c.username}" data-name="${escapeHtml(c.name)}">
            <div>
              <strong>${c.name} <span class="muted" style="font-weight:400; font-size:11px;">@${c.username}</span></strong>
              <span class="preview">${c.last_message}</span>
            </div>
            ${c.unread > 0 ? `<span class="conv-unread">${c.unread}</span>` : ""}
          </div>`).join("");
      wrap.querySelectorAll(".conv-item").forEach(item => {
        item.addEventListener("click", () => openConversation(item.dataset.username, item.dataset.name));
      });
    } catch (err) { /* صامت */ }
  }

  window.openConversation = async function (username, name) {
    activeConversationUsername = username;
    document.getElementById("chat-empty").style.display = "none";
    document.getElementById("chat-thread").style.display = "flex";
    document.getElementById("chat-thread").style.flexDirection = "column";
    document.getElementById("chat-header").innerHTML = `${escapeHtml(name)} <span class="muted" style="font-weight:400; font-size:12px;">@${username}</span>`;
    await refreshThread();
    loadConversations();
    loadUnreadBadge();
    if (messagesPollInterval) clearInterval(messagesPollInterval);
    messagesPollInterval = setInterval(refreshThread, 8000);
  };

  async function refreshThread() {
    if (!activeConversationUsername) return;
    try {
      const res = await fetch(`${API_BASE}/messages/with/${activeConversationUsername}`, { headers: authHeaders() });
      if (!res.ok) return;
      const data = await res.json();
      const wrap = document.getElementById("chat-messages");
      wrap.innerHTML = data.messages.map(m => `<div class="chat-bubble ${m.from_me ? 'mine' : 'theirs'}">${escapeHtml(m.content)}</div>`).join("");
      wrap.scrollTop = wrap.scrollHeight;
      loadUnreadBadge();
    } catch (err) { /* صامت */ }
  }
})();
</script>
</body>
</html>
