<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بروفايل | اتجاهك</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{background:var(--bg);}
  .profile-wrap{max-width:760px; margin:0 auto; padding:40px 20px 80px;}
  .profile-header{
    background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:32px; text-align:center; margin-bottom:20px;
  }
  .profile-name{font-size:24px; font-weight:700; color:var(--navy); margin:14px 0 4px;}
  .profile-major{color:var(--text-muted); font-size:14px; margin-bottom:10px;}
  .profile-badges{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .profile-badge{
    font-size:12px; font-weight:600; padding:5px 12px; border-radius:999px;
    background:#EAF1E9; color:var(--sage);
  }
  .profile-badge.gh{background:#EFE9F5; color:var(--violet);}
  .not-found{text-align:center; padding:60px 20px; color:var(--text-muted);}
</style>
</head>
<body>

<div class="profile-wrap" id="app">
  <div class="not-found">جارِ تحميل البروفايل...</div>
</div>

<script src="i18n.js"></script>
<script src="config.js"></script>
<script>
const API_BASE = window.ETIJAHAK_API_BASE || "http://127.0.0.1:8000";

function prettify(key) {
  return key.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

async function loadProfile() {
  const params = new URLSearchParams(window.location.search);
  const username = params.get("u");
  const app = document.getElementById("app");
  const isEn = CURRENT_LANG === "en";

  if (!username) {
    app.innerHTML = `<div class="not-found">${isEn ? "No profile specified. The link should look like: profile.html?u=username" : "لم يتم تحديد أي بروفايل. الرابط يجب أن يكون بالشكل: profile.html?u=اسم_المستخدم"}</div>`;
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/u/${encodeURIComponent(username)}`);
    if (res.status === 404) {
      app.innerHTML = `<div class="not-found">😕 ${isEn ? "No profile found with this link." : "لا يوجد بروفايل بهذا الرابط."}</div>`;
      return;
    }
    if (!res.ok) throw new Error(isEn ? "Couldn't load the profile" : "تعذّر تحميل البروفايل");
    const data = await res.json();
    render(data);
  } catch (err) {
    app.innerHTML = `<div class="not-found">${isEn ? "An error occurred while loading the profile." : "حدث خطأ أثناء تحميل البروفايل."}</div>`;
    console.error(err);
  }
}

function render(data) {
  const app = document.getElementById("app");
  const isEn = CURRENT_LANG === "en";

  const badges = [];
  if (data.github_username) badges.push(`<span class="profile-badge gh">🐙 GitHub: @${data.github_username}</span>`);
  if (data.linkedin_verified) badges.push(`<span class="profile-badge">✓ ${isEn ? "LinkedIn Verified" : "LinkedIn موثّق"}</span>`);

  const capabilitiesHtml = (data.capabilities && data.capabilities.length > 0)
    ? data.capabilities.map(c => `
        <div class="bar-row">
          <div class="bar-top"><span>${prettify(c.skill)}</span><span>${c.score}%</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${c.score}%"></div></div>
        </div>`).join("")
    : `<div class="empty-hint">${isEn ? "No skills recorded yet." : "لا توجد مهارات مسجّلة بعد."}</div>`;

  const projectsHtml = (data.projects && data.projects.length > 0)
    ? data.projects.map(p => `
        <div class="opp-card">
          <div class="opp-icon">${p.has_repo ? "🐙" : "🛠"}</div>
          <div class="opp-body">
            <strong>${p.url ? `<a href="${p.url}" target="_blank" rel="noopener">${p.title}</a>` : p.title}</strong>
            <span class="type">${(p.tags || []).join(isEn ? ", " : "، ")}</span>
            <div class="reason">${p.description || ""}</div>
          </div>
        </div>`).join("")
    : `<div class="empty-hint">${isEn ? "No projects added yet." : "لا توجد مشاريع مضافة بعد."}</div>`;

  const memberSince = data.member_since ? (isEn ? " · Member since " + data.member_since : " · عضو منذ " + data.member_since) : "";
  const contactLabel = isEn ? `💬 Contact ${data.name.split(' ')[0]}` : `💬 تواصل مع ${data.name.split(' ')[0]}`;

  app.innerHTML = `
    <div class="profile-header">
      <img src="assets/logo.png" alt="اتجاهك" class="brand-logo-img brand-logo-md" style="margin:0 auto;">
      <div class="profile-name">${data.name}</div>
      <div class="profile-major">${data.major || ""}${memberSince}</div>
      <div class="profile-badges">${badges.join("")}</div>
      <button class="btn-primary" style="margin-top:16px;" onclick="window.location.href='index.html?compose=${data.username}'">${contactLabel}</button>
    </div>

    <div class="card">
      <h3 class="section-title">${isEn ? "📊 Skills & Capabilities" : "📊 المهارات والقدرات"}</h3>
      <div class="bars-list">${capabilitiesHtml}</div>
    </div>

    <div class="card">
      <h3 class="section-title">${isEn ? "🛠 Projects" : "🛠 المشاريع"}</h3>
      <div class="opp-list">${projectsHtml}</div>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", () => {
  const btn = document.createElement("button");
  btn.className = "lang-toggle";
  btn.id = "profile-lang-toggle";
  document.body.appendChild(btn);
  btn.textContent = CURRENT_LANG === "ar" ? "English" : "العربية";
  btn.addEventListener("click", () => {
    setLanguage(CURRENT_LANG === "ar" ? "en" : "ar");
    loadProfile();
  });
  loadProfile();
});
</script>
</body>
</html>
