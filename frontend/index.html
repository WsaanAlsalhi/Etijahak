<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتجاهك | From Potential to Opportunity</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ شاشة الترحيب / Landing ============ -->
<section id="view-landing" class="view active">
  <div class="landing-wrap">
    <button class="lang-toggle">English</button>
    <div class="landing-brand">
      <img src="assets/logo.png" alt="اتجاهك" class="brand-logo-img brand-logo-lg">
    </div>
    <h1 class="landing-title" data-i18n="landing_title">From Potential to Opportunity</h1>
<p class="landing-sub" data-i18n="landing_sub"></p>
    <div class="landing-flow">
      <span>Capability</span><span class="arrow">→</span>
      <span>Evidence</span><span class="arrow">→</span>
      <span>Experience</span><span class="arrow">→</span>
      <span>Connection</span><span class="arrow">→</span>
      <span>Opportunity</span>
    </div>
    <div class="landing-actions">
      <button class="btn-primary btn-lg" id="btn-start" data-i18n="btn_signup">Create Account</button>
      <button class="btn-ghost btn-lg" id="btn-goto-login" data-i18n="btn_goto_login">Log In</button>
    </div>
  </div>
</section>

<!-- ============ شاشة إنشاء حساب ============ -->
<section id="view-signup" class="view">
  <div class="auth-wrap">
    <div class="landing-brand center"><img src="assets/logo.png" alt="اتجاهك" class="brand-logo-img brand-logo-md"></div>
    <div class="card auth-card">
      <h2 class="auth-title" data-i18n="signup_title"></h2>
      <p class="muted" data-i18n="signup_sub"></p>
      <form id="signup-form">
        <label><span data-i18n="field_name"></span>
          <input type="text" id="su-name" required>
        </label>
        <label><span data-i18n="field_email"></span>
          <input type="email" id="su-email" required>
        </label>
        <label><span data-i18n="field_major"></span>
          <input type="text" id="su-major">
        </label>
        <label><span data-i18n="field_password"></span>
          <input type="password" id="su-password" minlength="6" required>
        </label>
        <div id="signup-error" class="form-error"></div>
        <button type="submit" class="btn-primary btn-lg btn-block" data-i18n="btn_create_account"></button>
      </form>
      <p class="switch-auth"><span data-i18n="switch_have_account"></span> <a href="#" id="link-goto-login" data-i18n="link_login"></a></p>
    </div>
  </div>
</section>

<!-- ============ شاشة تسجيل الدخول ============ -->
<section id="view-login" class="view">
  <div class="auth-wrap">
    <div class="landing-brand center"><img src="assets/logo.png" alt="اتجاهك" class="brand-logo-img brand-logo-md"></div>
    <div class="card auth-card">
      <h2 class="auth-title" data-i18n="login_title"></h2>
      <p class="muted" data-i18n="login_sub"></p>
      <form id="login-form">
        <label><span data-i18n="field_email"></span>
          <input type="email" id="li-email" required>
        </label>
        <label><span data-i18n="field_password_simple"></span>
          <input type="password" id="li-password" required>
        </label>
        <div id="login-error" class="form-error"></div>
        <button type="submit" class="btn-primary btn-lg btn-block" data-i18n="btn_login"></button>
      </form>
      <p class="switch-auth"><span data-i18n="switch_no_account"></span> <a href="#" id="link-goto-signup" data-i18n="link_signup"></a></p>
    </div>
  </div>
</section>

<!-- ============ شاشة الملف الشخصي والهدف ============ -->
<section id="view-onboarding" class="view">
  <div class="onboarding-wrap">
    <div class="onboarding-header">
      <img src="assets/logo.png" alt="اتجاهك" class="brand-logo-img brand-logo-md">
      <h2 data-i18n="onboarding_title"></h2>
      <p class="muted" data-i18n="onboarding_sub"></p>
    </div>

    <form id="profile-form">
      <div class="card">
        <h3 class="section-title" data-i18n="section_connect"></h3>
        <div class="connect-row">
          <div class="connect-item">
            <div class="connect-info">
              <strong>GitHub</strong>
              <span id="github-status-text" class="muted" data-i18n="connect_github_status_off"></span>
            </div>
            <button type="button" class="btn-ghost" id="btn-connect-github" data-i18n="btn_connect_github"></button>
          </div>
          <div class="connect-item">
            <div class="connect-info">
              <strong>LinkedIn</strong>
              <span id="linkedin-status-text" class="muted" data-i18n="connect_linkedin_status_off"></span>
            </div>
            <button type="button" class="btn-ghost" id="btn-connect-linkedin" data-i18n="btn_connect_linkedin"></button>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 class="section-title" data-i18n="section_goal"></h3>
        <label>
          <span data-i18n="field_goal_label"></span>
          <select id="f-goal" required></select>
        </label>
        <div id="custom-goal-box" class="custom-goal-box" style="display:none;">
          <label>
            <span data-i18n="custom_goal_label"></span>
            <div class="custom-goal-row">
              <input type="text" id="custom-goal-text" data-i18n-placeholder="custom_goal_placeholder">
              <button type="button" class="btn-primary" id="btn-generate-goal" data-i18n="btn_analyze_goal"></button>
            </div>
          </label>
          <div id="custom-goal-status" class="muted" style="font-size:12px;"></div>
        </div>
      </div>

      <div class="card">
        <div class="section-header-row">
          <h3 class="section-title" data-i18n="section_skills"></h3>
          <button type="button" class="btn-ghost" data-add="skill" data-i18n="btn_add_skill"></button>
        </div>
        <div id="skills-list" class="repeat-list"></div>
      </div>

      <div class="card">
        <div class="section-header-row">
          <h3 class="section-title" data-i18n="section_projects"></h3>
          <button type="button" class="btn-ghost" data-add="project" data-i18n="btn_add_project"></button>
        </div>
        <div id="projects-list" class="repeat-list"></div>
      </div>

      <div class="card">
        <div class="section-header-row">
          <h3 class="section-title" data-i18n="section_certs"></h3>
          <button type="button" class="btn-ghost" data-add="certificate" data-i18n="btn_add_cert"></button>
        </div>
        <div id="certificates-list" class="repeat-list"></div>
      </div>

<button type="submit" class="btn-primary btn-lg btn-block" id="btn-analyze" data-i18n="btn_analyze"></button>
    </form>
  </div>
</section>

<!-- ============ شاشة اللوحة الرئيسية (Dashboard) ============ -->
<section id="view-dashboard" class="view">
  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="assets/logo.png" alt="اتجاهك" class="brand-logo-img brand-logo-sm">
        <span class="brand-name">اتجاهك</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-section="overview" data-i18n="nav_home"></a>
        <a href="#" class="nav-item" data-section="capabilities" data-i18n="nav_skills"></a>
        <a href="#" class="nav-item" data-section="bridge" data-i18n="nav_bridge"></a>
        <a href="#" class="nav-item" data-section="connections" data-i18n="nav_connections"></a>
        <a href="#" class="nav-item" data-section="opportunities" data-i18n="nav_opportunities"></a>
        <a href="#" class="nav-item" data-section="competitions" data-i18n="nav_competitions"></a>
        <a href="#" class="nav-item" data-section="messages"><span data-i18n="nav_messages"></span> <span id="unread-badge" class="unread-badge" style="display:none;"></span></a>
      </nav>
      <button class="btn-ghost btn-block" id="btn-restart" data-i18n="btn_restart"></button>
      <button class="btn-ghost btn-block" id="btn-copy-profile-link" data-i18n="btn_copy_profile_link"></button>
      <button class="btn-ghost btn-block" id="btn-logout" data-i18n="btn_logout"></button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-search">🔍 <span data-i18n="search_placeholder"></span></div>
        <button class="lang-toggle">English</button>
        <div class="topbar-user">
          <span id="user-name-badge">--</span>
          <span class="avatar">🙂</span>
        </div>
      </header>

      <div class="greeting">
        <h2><span data-i18n="greeting_hi"></span> <span id="greet-name">--</span> 👋</h2>
        <p class="muted"><span data-i18n="greeting_goal"></span> <strong id="greet-goal">--</strong></p>
      </div>

      <!-- صف الملخص العلوي -->
      <div class="summary-row">
        <div class="card summary-card">
          <h4 class="section-title" data-i18n="summary_goal"></h4>
          <p id="sum-goal" class="summary-value">--</p>
        </div>
        <div class="card summary-card readiness-card">
          <h4 class="section-title" data-i18n="summary_readiness"></h4>
          <div class="ring-wrap">
            <svg viewBox="0 0 120 120" class="ring">
              <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
              <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"></circle>
            </svg>
            <div class="ring-label" id="readiness-value">0%</div>
          </div>
        </div>
        <div class="card summary-card">
          <h4 class="section-title" data-i18n="summary_gaps"></h4>
          <p id="sum-gaps" class="summary-value">--</p>
        </div>
      </div>

      <div class="grid-dashboard">
        <!-- المهارات -->
        <div class="card" id="section-capabilities">
          <h3 class="section-title" data-i18n="section_capabilities_title"></h3>
          <div id="capabilities-list" class="bars-list"></div>
        </div>

        <!-- مشاريع GitHub -->
        <div class="card wide" id="section-github-projects" style="display:none;">
          <h3 class="section-title" data-i18n="section_github_projects_title"></h3>
          <div id="github-projects-list" class="opp-list"></div>
        </div>

        <!-- الفجوات -->
        <div class="card" id="section-gaps">
          <h3 class="section-title" data-i18n="section_gaps_title"></h3>
          <div id="gaps-list" class="tags-list"></div>
        </div>

        <!-- الجسر -->
        <div class="card wide" id="section-bridge">
          <h3 class="section-title" data-i18n="section_bridge_title"></h3>
          <ol id="bridge-list" class="bridge-steps"></ol>
        </div>

        <!-- العلاقات -->
        <div class="card" id="section-connections">
          <h3 class="section-title" data-i18n="section_connections_title"></h3>
          <div id="connections-list" class="people-list"></div>
        </div>

        <!-- الفرص -->
        <div class="card" id="section-opportunities">
          <h3 class="section-title" data-i18n="section_opportunities_title"></h3>
          <div id="opportunities-list" class="opp-list"></div>
        </div>

        <!-- المسابقات والهاكاثونات -->
        <div class="card wide" id="section-competitions">
          <h3 class="section-title" data-i18n="section_competitions_title"></h3>
          <div id="competitions-list" class="comp-list"></div>
        </div>

        <!-- الرسائل -->
        <div class="card wide" id="section-messages">
          <h3 class="section-title" data-i18n="section_messages_title"></h3>
          <div class="messages-shell">
            <div class="conv-sidebar">
              <div class="conv-search">
                <input type="text" id="user-search-input" data-i18n-placeholder="user_search_placeholder">
                <div id="user-search-results" class="search-results"></div>
              </div>
              <div id="conversations-list" class="conv-list"></div>
            </div>
            <div class="conv-main">
              <div id="chat-empty" class="empty-hint" data-i18n="chat_placeholder"></div>
              <div id="chat-thread" style="display:none;">
                <div class="chat-header" id="chat-header"></div>
                <div class="chat-messages" id="chat-messages"></div>
                <form id="chat-form" class="chat-form">
                  <input type="text" id="chat-input" data-i18n-placeholder="chat_input_placeholder" autocomplete="off">
                  <button type="submit" class="btn-primary" data-i18n="btn_send"></button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</section>

<!-- قالب مخفي لعنصر مهارة -->
<template id="tpl-skill">
  <div class="repeat-item">
    <input type="text" placeholder="اسم المهارة (مثال: Python)" class="skill-name">
    <select class="skill-level">
      <option value="1">1 - مبتدئ</option>
      <option value="2">2</option>
      <option value="3" selected>3 - متوسط</option>
      <option value="4">4</option>
      <option value="5">5 - متقدم</option>
    </select>
    <button type="button" class="btn-remove" title="حذف">✕</button>
  </div>
</template>

<!-- قالب مخفي لعنصر مشروع -->
<template id="tpl-project">
  <div class="repeat-item project-item">
    <input type="text" placeholder="عنوان المشروع" class="project-title">
    <input type="text" placeholder="الوسوم (مفصولة بفاصلة): python, computer_vision" class="project-tags">
    <label class="checkbox-inline"><input type="checkbox" class="project-repo"> له مستودع GitHub / رابط فعلي</label>
    <button type="button" class="btn-remove" title="حذف">✕</button>
  </div>
</template>

<!-- قالب مخفي لعنصر شهادة -->
<template id="tpl-certificate">
  <div class="repeat-item">
    <input type="text" placeholder="اسم الشهادة" class="cert-title">
    <input type="text" placeholder="الوسوم: machine_learning" class="cert-tags">
    <button type="button" class="btn-remove" title="حذف">✕</button>
  </div>
</template>

<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
