<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية | اتجاهك</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="layout-root"></div>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function init() {
  const user = await requireAuth();
  if (!user) return;
  renderShell("home", user);

  const main = document.getElementById("page-main");
  const isEn = () => (typeof CURRENT_LANG !== "undefined" && CURRENT_LANG === "en");

  main.innerHTML = `<div class="empty-hint">...</div>`;

  try {
    const res = await fetch(`${API_BASE}/analyze/last`, { headers: authHeaders() });

    if (res.status === 404) {
      // لا يوجد تحليل سابق بعد — نرحّب بالمستخدم ونعرض دعوة لبدء أول تحليل
      main.innerHTML = `
        <div class="greeting">
          <h2>${isEn() ? "Welcome" : "أهلًا وسهلًا"}, ${user.name} 👋</h2>
          <p class="muted">${isEn() ? "You haven't run an analysis yet. Start now to discover your gaps and build your bridge to opportunity." : "لسا ما سويتِ أي تحليل. ابدئي الآن لتكتشفي فجواتك وتبنين جسرك نحو الفرصة."}</p>
        </div>
        <div class="card" style="text-align:center; padding:48px 24px;">
          <div style="font-size:40px; margin-bottom:12px;">🌉</div>
          <h3 class="section-title" style="justify-content:center;">${isEn() ? "Start your first analysis" : "ابدئي تحليلك الأول"}</h3>
          <p class="muted" style="margin-bottom:20px;">${isEn() ? "Add your skills and projects, choose a goal, and let AI build your plan." : "أضيفي مهاراتك ومشاريعك، اختاري هدفًا، ودعي الذكاء الاصطناعي يبني خطتك."}</p>
          <a href="analyze.html" class="btn-primary btn-lg">${isEn() ? "Start Analysis 🌉" : "ابدئي التحليل 🌉"}</a>
        </div>
      `;
      return;
    }

    if (!res.ok) throw new Error("failed");
    const analysis = await res.json();
    const goalName = bi(analysis, "goal_name_ar", "goal_name_en");
    const readiness = analysis.overall_readiness;

    main.innerHTML = `
      <div class="greeting">
        <h2><span data-i18n="greeting_hi"></span> ${user.name} 👋</h2>
        <p class="muted"><span data-i18n="greeting_goal"></span> <strong>${goalName}</strong></p>
      </div>

      <div class="summary-row">
        <div class="card summary-card">
          <h4 class="section-title" data-i18n="summary_goal"></h4>
          <p class="summary-value">${goalName}</p>
        </div>
        <div class="card summary-card readiness-card">
          <h4 class="section-title" data-i18n="summary_readiness"></h4>
          <div class="ring-wrap">
            <svg viewBox="0 0 120 120" class="ring">
              <circle cx="60" cy="60" r="52" class="ring-bg"></circle>
              <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"></circle>
            </svg>
            <div class="ring-label">${readiness}%</div>
          </div>
        </div>
        <div class="card summary-card">
          <h4 class="section-title" data-i18n="summary_gaps"></h4>
          <p class="summary-value">${analysis.gaps.length}</p>
        </div>
      </div>

      <div class="grid-dashboard">
        <a href="skills.html" class="card" style="text-decoration:none; display:block;">
          <h3 class="section-title">📊 ${isEn() ? "Your Skills" : "مهاراتك"}</h3>
          <p class="muted">${analysis.capabilities.length} ${isEn() ? "skills tracked" : "مهارة مرصودة"}</p>
        </a>
        <a href="bridge.html" class="card" style="text-decoration:none; display:block;">
          <h3 class="section-title">🌉 ${isEn() ? "Your Bridge Plan" : "خطتك (الجسر)"}</h3>
          <p class="muted">${analysis.bridge.length} ${isEn() ? "steps" : "خطوة"}</p>
        </a>
        <a href="connections.html" class="card" style="text-decoration:none; display:block;">
          <h3 class="section-title">🤝 ${isEn() ? "Connections" : "العلاقات المقترحة"}</h3>
          <p class="muted">${analysis.connections.length} ${isEn() ? "people" : "شخص"}</p>
        </a>
        <a href="opportunities.html" class="card" style="text-decoration:none; display:block;">
          <h3 class="section-title">🚀 ${isEn() ? "Opportunities" : "الفرص"}</h3>
          <p class="muted">${isEn() ? "View matched opportunities" : "شوفي الفرص المطابقة لك"}</p>
        </a>
        <a href="competitions.html" class="card" style="text-decoration:none; display:block;">
          <h3 class="section-title">🏆 ${isEn() ? "Competitions" : "المسابقات"}</h3>
          <p class="muted">${isEn() ? "Live hackathons from Devpost" : "هاكاثونات حقيقية من Devpost"}</p>
        </a>
        <a href="analyze.html" class="card" style="text-decoration:none; display:block;">
          <h3 class="section-title">↺ ${isEn() ? "New Analysis" : "تحليل جديد"}</h3>
          <p class="muted">${isEn() ? "Update your skills or change your goal" : "حدّثي مهاراتك أو غيّري هدفك"}</p>
        </a>
        <a href="contact.html" class="card" style="text-decoration:none; display:block;">
          <h3 class="section-title">📞 ${isEn() ? "Contact Us" : "تواصل معنا"}</h3>
          <p class="muted">${isEn() ? "LinkedIn, Instagram, Email" : "لنكدان، انستقرام، إيميل"}</p>
        </a>
      </div>
    `;

    const circumference = 326.7;
    const offset = circumference - (circumference * readiness) / 100;
    document.getElementById("ring-fg").style.strokeDashoffset = offset;
    if (typeof applyTranslations === "function") applyTranslations();
  } catch (err) {
    main.innerHTML = `<div class="empty-hint">${isEn() ? "Something went wrong loading your data." : "حدث خطأ أثناء تحميل بياناتك."}</div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
