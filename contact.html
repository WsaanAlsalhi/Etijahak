<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا | اتجاهك</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .contact-list{display:flex; flex-direction:column; gap:14px;}
  .contact-item{
    display:flex; align-items:center; gap:14px; padding:16px; border-radius:12px;
    background:#FAFAFC; border:1px solid #EEF0F4; text-decoration:none; color:inherit;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .contact-item:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .contact-icon{
    width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0; color:#fff;
  }
  .contact-icon.linkedin{background:#0A66C2;}
  .contact-icon.instagram{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);}
  .contact-icon.email{background:var(--blue);}
  .contact-body strong{display:block; color:var(--navy); font-size:14px;}
  .contact-body span{display:block; color:var(--text-muted); font-size:13px; margin-top:2px;}
</style>
</head>
<body>
<div id="layout-root"></div>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function init() {
  const user = await requireAuth();
  if (!user) return;
  renderShell("contact", user);
  const main = document.getElementById("page-main");
  const isEn = () => (typeof CURRENT_LANG !== "undefined" && CURRENT_LANG === "en");

  // ============================================================
  // ⚠️ عدّلي القيم الثلاثة هذي بمعلوماتك الحقيقية
  // ============================================================
  const LINKEDIN_URL = "https://linkedin.com/company/etijahak";
  const INSTAGRAM_URL = "https://instagram.com/etijahak";
  const CONTACT_EMAIL = "contact@etijahak.com";
  // ============================================================

  main.innerHTML = `
    <h2 style="color:var(--navy); margin-bottom:6px;">${isEn() ? "Contact Us" : "تواصل معنا"}</h2>
    <p class="muted" style="margin-bottom:20px;">${isEn() ? "We'd love to hear from you — reach out through any of these channels." : "يسعدنا تواصلك معنا — تقدرين تتواصلين عبر أي من هذي القنوات."}</p>

    <div class="card">
      <div class="contact-list">
        <a href="${LINKEDIN_URL}" target="_blank" rel="noopener" class="contact-item">
          <div class="contact-icon linkedin">in</div>
          <div class="contact-body">
            <strong>LinkedIn</strong>
            <span>${isEn() ? "Follow our page for updates" : "تابعي صفحتنا لآخر التحديثات"}</span>
          </div>
        </a>

        <a href="${INSTAGRAM_URL}" target="_blank" rel="noopener" class="contact-item">
          <div class="contact-icon instagram">📷</div>
          <div class="contact-body">
            <strong>Instagram</strong>
            <span>${isEn() ? "Follow us for news and tips" : "تابعينا للأخبار والنصائح"}</span>
          </div>
        </a>

        <a href="mailto:${CONTACT_EMAIL}" class="contact-item">
          <div class="contact-icon email">✉️</div>
          <div class="contact-body">
            <strong>${isEn() ? "Email" : "البريد الإلكتروني"}</strong>
            <span>${CONTACT_EMAIL}</span>
          </div>
        </a>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
