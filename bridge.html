<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجسر | اتجاهك</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="layout-root"></div>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function init() {
  const user = await requireAuth();
  if (!user) return;
  renderShell("bridge", user);
  const main = document.getElementById("page-main");
  const isEn = () => (typeof CURRENT_LANG !== "undefined" && CURRENT_LANG === "en");

  try {
    const res = await fetch(`${API_BASE}/analyze/last`, { headers: authHeaders() });
    if (res.status === 404) {
      main.innerHTML = `<div class="card" style="text-align:center; padding:40px;"><p class="muted">${isEn() ? "No analysis yet." : "لا يوجد تحليل بعد."}</p><a href="analyze.html" class="btn-primary">${isEn() ? "Start Analysis" : "ابدئي التحليل"}</a></div>`;
      return;
    }
    if (!res.ok) throw new Error("failed");
    const analysis = await res.json();

    const bridgeHtml = analysis.bridge.map(step => `
      <li>
        <div class="step-num">${step.order}</div>
        <div class="step-body">
          <strong>${bi(step, "title_ar", "title_en")}</strong>
          <span>${bi(step, "description_ar", "description_en")}</span>
        </div>
      </li>`).join("");

    main.innerHTML = `
      <h2 style="color:var(--navy); margin-bottom:16px;">🌉 ${isEn() ? "Your Smart Plan" : "خطتك الذكية"}</h2>
      <div class="card"><ol class="bridge-steps">${bridgeHtml}</ol></div>`;
  } catch (err) {
    main.innerHTML = `<div class="empty-hint">${isEn() ? "Error loading data." : "خطأ بتحميل البيانات."}</div>`;
  }
})();
</script>
</body>
</html>
